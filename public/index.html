<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastebin Clone</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
     <div class="lines">
    <div class="line"></div>
    <div class="line"></div>
    <div class="line"></div>
    <div class="line"></div>
    <div class="line"></div>
    <div class="line"></div>
    <div class="line"></div>
    <div class="line"></div>
    <div class="line"></div>
    <div class="line"></div>
  </div>
    <div class="container">
        <header>
            <h1>Pastebin Site</h1>
            <p class="subtitle">Share text snippets </p>
        </header>

        <div id="createForm" class="card">
            <form id="pasteForm">
                <div class="form-group">
                    <label for="title">Title (optional)</label>
                    <input type="text" id="title" placeholder="Untitled paste" maxlength="100">
                </div>

                <div class="form-group">
                    <label for="content">Content *</label>
                    <textarea id="content" placeholder="Paste your text here..." required></textarea>
                </div>

                <div class="options-grid">
                    <div class="form-group">
                        <label for="expiry">
                            <span class="icon">⏱️</span> Expiration
                        </label>
                        <select id="expiry">
                            <option value="never">Never</option>
                            <option value="10min">10 Minutes</option>
                            <option value="1hour">1 Hour</option>
                            <option value="1day">1 Day</option>
                            <option value="1week">1 Week</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="maxViews">
                            <span class="icon">👁️</span> Max Views (optional)
                        </label>
                        <input type="number" id="maxViews" placeholder="Unlimited" min="1" max="1000">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" id="submitBtn">
                    <span class="btn-text">Create Paste</span>
                    <span class="loader" style="display: none;"></span>
                </button>
            </form>

            <div id="errorMsg" class="error-msg" style="display: none;"></div>
        </div>

        <!-- Success Message -->
        <div id="successCard" class="card success-card" style="display: none;">
            <div class="success-icon">✓</div>
            <h2>Paste Created Successfully!</h2>
            <div class="share-link-container">
                <input type="text" id="shareLink" readonly>
                <button id="copyBtn" class="btn btn-secondary">
                    <span id="copyText">Copy</span>
                </button>
            </div>
            <button id="newPasteBtn" class="btn btn-outline">Create Another Paste</button>
        </div>

        <!-- View Paste -->
        <div id="viewCard" class="card" style="display: none;">
            <div class="paste-header">
                <h2 id="pasteTitle"></h2>
                <div class="paste-meta">
                    <span id="pasteDate"></span>
                    <span id="pasteViews"></span>
                    <span id="pasteExpiry"></span>
                </div>
            </div>
            <pre id="pasteContent"></pre>
            <button id="newPasteFromView" class="btn btn-outline">Create New Paste</button>
        </div>

        <!-- Error View -->
        <div id="errorCard" class="card error-card" style="display: none;">
            <div class="error-icon">⚠️</div>
            <h2>Paste Not Found</h2>
            <p id="errorText"></p>
            <button id="homeBtn" class="btn btn-primary">Go Home</button>
        </div>
    </div>

    <footer>
        <p>Built with ❤️ Amar</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
